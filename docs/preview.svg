<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img">
  <!-- Composer: two text bars, the caret already on a fresh line. -->
  <rect x="56" y="64" width="336" height="172" rx="16" fill="none" stroke="#8b95a8" stroke-width="2.5" />
  <g stroke-linecap="round" fill="none">
    <path d="M88 112 H300" stroke="#b9c2d1" stroke-width="10" />
    <path d="M88 158 V198" stroke="#4d6bfe" stroke-width="3.5" />
  </g>

  <!-- Keycap: the Enter key, with a return arrow. -->
  <rect x="452" y="96" width="128" height="104" rx="20" fill="none" stroke="#4d6bfe" stroke-width="3" />
  <g stroke="#4d6bfe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M486 168 H524 Q546 168 546 147 V128" />
    <path d="M500 154 L486 168 L500 182" />
  </g>

  <!-- Which surface the key drives. -->
  <path d="M444 148 H404" stroke="#b9c2d1" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" fill="none" />
</svg>
